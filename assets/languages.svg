<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none">
  <style>
    .title { font: 700 18px 'Segoe UI', Ubuntu, sans-serif; fill: #c084fc; }
    .lang  { font: 600 13px 'Segoe UI', Ubuntu, sans-serif; fill: #e9d5ff; }
    .pct   { font: 400 12px 'Segoe UI', Ubuntu, sans-serif; fill: #8b949e; }
    .item  { opacity: 0; animation: fade .5s ease-out forwards; }
    @keyframes fade { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
    .glow  { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
  </style>

  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="bar">
      <rect x="25" y="55" width="0" height="10" rx="5">
        <animate attributeName="width" from="0" to="445" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="494" height="194" rx="10" fill="#0d1117"/>
  <rect class="glow" x="0.5" y="0.5" width="494" height="194" rx="10" stroke="url(#border)" stroke-width="1"/>

  <text x="25" y="36" class="title">Most Used Languages</text>

  <!-- stacked bar (all repos incl. private, excl. Jupyter output) -->
  <g clip-path="url(#bar)">
    <rect x="25"    y="55" width="186.8" height="10" fill="#a855f7"/>
    <rect x="211.8" y="55" width="140.3" height="10" fill="#22d3ee"/>
    <rect x="352.1" y="55" width="54.1"  height="10" fill="#ec4899"/>
    <rect x="406.2" y="55" width="23.9"  height="10" fill="#818cf8"/>
    <rect x="430.1" y="55" width="18.6"  height="10" fill="#f472b6"/>
    <rect x="448.7" y="55" width="10.4"  height="10" fill="#38bdf8"/>
    <rect x="459.1" y="55" width="10.9"  height="10" fill="#475569"/>
  </g>

  <!-- legend: column 1 -->
  <g class="item" style="animation-delay:.3s"><circle cx="30" cy="96" r="5" fill="#a855f7"/><text x="42" y="100" class="lang">Java</text><text x="120" y="100" class="pct">41.97%</text></g>
  <g class="item" style="animation-delay:.45s"><circle cx="30" cy="121" r="5" fill="#22d3ee"/><text x="42" y="125" class="lang">JavaScript</text><text x="120" y="125" class="pct">31.52%</text></g>
  <g class="item" style="animation-delay:.6s"><circle cx="30" cy="146" r="5" fill="#ec4899"/><text x="42" y="150" class="lang">C++</text><text x="120" y="150" class="pct">12.15%</text></g>
  <g class="item" style="animation-delay:.75s"><circle cx="30" cy="171" r="5" fill="#818cf8"/><text x="42" y="175" class="lang">Python</text><text x="120" y="175" class="pct">5.38%</text></g>

  <!-- legend: column 2 -->
  <g class="item" style="animation-delay:.9s"><circle cx="265" cy="96" r="5" fill="#f472b6"/><text x="277" y="100" class="lang">HTML</text><text x="355" y="100" class="pct">4.19%</text></g>
  <g class="item" style="animation-delay:1.05s"><circle cx="265" cy="121" r="5" fill="#38bdf8"/><text x="277" y="125" class="lang">CSS</text><text x="355" y="125" class="pct">2.33%</text></g>
  <g class="item" style="animation-delay:1.2s"><circle cx="265" cy="146" r="5" fill="#475569"/><text x="277" y="150" class="lang">Other</text><text x="355" y="150" class="pct">2.45%</text></g>
</svg>
